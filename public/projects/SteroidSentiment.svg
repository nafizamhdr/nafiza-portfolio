<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Steroid Discourse Sentiment — NLP sentiment analysis">
  <defs>
    <linearGradient id="bgs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1729"/>
      <stop offset="100%" stop-color="#1A0F1E"/>
    </linearGradient>
    <linearGradient id="pos" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="neg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="neu" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgs)"/>

  <!-- Subtle grid lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Speech bubbles (top) -->
  <g transform="translate(60 60)">
    <rect width="180" height="46" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="20" y="29" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">comment.text →</text>
  </g>
  <g transform="translate(560 60)">
    <rect width="180" height="46" rx="22" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="90" y="29" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">+0.87 POSITIVE</text>
  </g>

  <!-- Connecting arrow -->
  <path d="M 240 83 L 540 83" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="540,83 530,78 530,88" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- Bar chart -->
  <g transform="translate(80 350)">
    <!-- Positive -->
    <rect x="0" y="-160" width="48" height="160" rx="4" fill="url(#pos)"/>
    <text x="24" y="20" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#34D399" text-anchor="middle">POS</text>
    <text x="24" y="-170" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">42%</text>

    <!-- Neutral -->
    <rect x="80" y="-110" width="48" height="110" rx="4" fill="url(#neu)"/>
    <text x="104" y="20" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">NEU</text>
    <text x="104" y="-120" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">28%</text>

    <!-- Negative -->
    <rect x="160" y="-115" width="48" height="115" rx="4" fill="url(#neg)"/>
    <text x="184" y="20" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#F87171" text-anchor="middle">NEG</text>
    <text x="184" y="-125" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">30%</text>
  </g>

  <!-- Title block (right) -->
  <g transform="translate(340 180)">
    <text font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-1">YOUTUBE</text>
    <text y="48" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" fill-opacity="0.35" letter-spacing="-1">SENTIMENT</text>
    <text y="84" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#34D399" letter-spacing="3">NLP · TF-IDF · VADER</text>
  </g>

  <!-- Model badges -->
  <g transform="translate(340 320)" font-family="ui-monospace, monospace" font-size="10" font-weight="600">
    <g transform="translate(0 0)">
      <rect width="90" height="24" rx="12" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.4"/>
      <text x="45" y="16" fill="#818CF8" text-anchor="middle">LOGREG</text>
    </g>
    <g transform="translate(100 0)">
      <rect width="120" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="60" y="16" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">RANDOM FOREST</text>
    </g>
    <g transform="translate(230 0)">
      <rect width="90" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="45" y="16" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">LIN-SVM</text>
    </g>
  </g>
</svg>
