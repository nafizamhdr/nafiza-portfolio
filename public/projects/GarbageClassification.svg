<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Garbage Classification — MobileNetV2 deep learning">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1729"/>
      <stop offset="100%" stop-color="#0F1F1A"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="green-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgg)"/>
  <ellipse cx="280" cy="250" rx="280" ry="200" fill="url(#green-glow)"/>

  <!-- 10-class grid representing classification categories -->
  <g transform="translate(440 110)">
    <!-- 5 columns x 2 rows of small icon tiles -->
    <!-- Row 1 -->
    <g transform="translate(0 0)">
      <rect width="56" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="28" y="36" font-family="Inter, sans-serif" font-size="20" text-anchor="middle" fill="#34D399">🍌</text>
    </g>
    <g transform="translate(64 0)">
      <rect width="56" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="28" y="36" font-family="Inter, sans-serif" font-size="20" text-anchor="middle" fill="#34D399">📦</text>
    </g>
    <g transform="translate(128 0)">
      <rect width="56" height="56" rx="10" fill="url(#green-grad)" fill-opacity="0.85" stroke="#34D399" stroke-width="2"/>
      <text x="28" y="36" font-family="Inter, sans-serif" font-size="20" text-anchor="middle" fill="#FFFFFF">🍾</text>
    </g>
    <g transform="translate(192 0)">
      <rect width="56" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="28" y="36" font-family="Inter, sans-serif" font-size="20" text-anchor="middle" fill="#34D399">📰</text>
    </g>
    <g transform="translate(256 0)">
      <rect width="56" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="28" y="36" font-family="Inter, sans-serif" font-size="20" text-anchor="middle" fill="#34D399">🥫</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0 64)">
      <rect width="56" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="28" y="36" font-family="Inter, sans-serif" font-size="20" text-anchor="middle" fill="#34D399">🍞</text>
    </g>
    <g transform="translate(64 64)">
      <rect width="56" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="28" y="36" font-family="Inter, sans-serif" font-size="20" text-anchor="middle" fill="#34D399">🥤</text>
    </g>
    <g transform="translate(128 64)">
      <rect width="56" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="28" y="36" font-family="Inter, sans-serif" font-size="20" text-anchor="middle" fill="#34D399">👕</text>
    </g>
    <g transform="translate(192 64)">
      <rect width="56" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="28" y="36" font-family="Inter, sans-serif" font-size="20" text-anchor="middle" fill="#34D399">🔋</text>
    </g>
    <g transform="translate(256 64)">
      <rect width="56" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="28" y="36" font-family="Inter, sans-serif" font-size="20" text-anchor="middle" fill="#34D399">📱</text>
    </g>
  </g>

  <!-- Prediction caption under grid -->
  <g transform="translate(440 250)" font-family="ui-monospace, monospace" font-size="10">
    <text fill="#94A3B8" letter-spacing="2">PREDICTION:</text>
    <text x="0" y="20" fill="#34D399" font-weight="700" letter-spacing="2">GLASS · 97.3%</text>
  </g>

  <!-- Title -->
  <g transform="translate(60 200)">
    <text font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="-2">GARBAGE</text>
    <text y="60" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" fill-opacity="0.4" letter-spacing="-2">CLASSIFIER</text>
    <text y="100" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#34D399" letter-spacing="3">MOBILENETV2 · TRANSFER LEARNING</text>
  </g>

  <!-- Network layer hint -->
  <g transform="translate(60 360)" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">
    <text>INPUT 224×224×3</text>
    <text x="120">→ MOBILENETV2</text>
    <text x="240">→ GAP</text>
    <text x="280">→ DENSE 10</text>
  </g>

  <!-- Recycle motif -->
  <g transform="translate(110 410)" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 8 L 8 0 L 16 8"/>
    <path d="M 16 8 L 24 16 L 16 24"/>
    <path d="M 16 24 L 8 24 L 0 16"/>
  </g>

  <!-- Stat -->
  <g transform="translate(610 380)" font-family="Inter, sans-serif">
    <text font-size="44" font-weight="900" fill="#34D399" text-anchor="end" x="120">97<tspan font-size="20" fill="#10B981">%</tspan></text>
    <text y="14" x="120" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="2" text-anchor="end">VAL ACCURACY</text>
  </g>
</svg>
